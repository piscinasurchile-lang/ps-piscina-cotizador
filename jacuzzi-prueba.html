<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PiscinaSur · Jacuzzi</title><style>body{font-family:Arial,sans-serif;background:#eef4f6;color:#173247;margin:0;padding:20px}.w{max-width:850px;margin:auto}.card{background:white;border:1px solid #c9d9de;border-radius:14px;padding:20px;margin-bottom:16px}h1,h2{color:#0b5e6b}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-size:13px}select,input{width:100%;padding:10px;border:1px solid #c9d9de;border-radius:8px;box-sizing:border-box;margin-top:5px}button{padding:12px 16px;border:0;border-radius:9px;background:#0b5e6b;color:white;font-weight:700;cursor:pointer}.secondary{background:#657089}.total{font-size:28px;font-weight:700}.muted{color:#6b7d89;font-size:12px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #dde9ec;text-align:left}td:last-child,th:last-child{text-align:right}@media(max-width:600px){.g{grid-template-columns:1fr}}@media print{button,.no-print{display:none}body{background:white}.card{border:0}}</style></head><body><div class="w"><div class="card"><h1>PISCINASUR · Cotización Jacuzzi</h1><div class="muted">Construimos tus mejores momentos · Villarrica – Puerto Montt</div></div><div class="card no-print"><div class="g"><label>Medida<select id="medida"><option value="2.5">2,5 × 2,5 m</option><option value="3">3 × 3 m</option></select></label><label>Profundidad interior (m)<input id="prof" type="number" value="1.20" min="0.5" step="0.05"></label><label>Ciudad<select id="ciudad"><option>Villarrica</option><option>Pucon</option><option>Temuco</option><option>Valdivia</option><option>Osorno</option><option>Puerto Montt</option><option>Puerto Varas</option></select></label><label>Hormigón<select id="tipo"><option value="mano">Preparación a mano</option><option value="camion">Hormigón camión</option></select></label><label>Bomba de calor 70 m³<select id="bc"><option value="0">Sin bomba</option><option value="1">Agregar bomba 70 m³</option></select></label><label>Margen comercial (%)<input id="margen" type="number" value="0" min="0" step="1"></label></div></div><div class="card"><h2 id="titulo"></h2><div id="detalle"></div><p>Valor base Jacuzzi</p><div class="total" id="base"></div><p id="lineaBC"></p><table><tr><td>Neto</td><td id="neto"></td></tr><tr><td>IVA 19%</td><td id="iva"></td></tr><tr><th>Total</th><th id="total"></th></tr></table><p class="muted">Valor base = materiales estructurales calculados + mano de obra. La bomba de calor se presenta separada como adicional.</p><button onclick="window.print()">Generar PDF individual</button> <button class="secondary no-print" onclick="location.href='index.html'">Volver al cotizador</button></div></div><script>const CEMENTO={Temuco:4790,Villarrica:4590,Valdivia:5170,Osorno:5420,'Puerto Montt':5420,'Puerto Varas':5420,Pucon:4590};const ARIDO={Temuco:38000,Villarrica:38000,Valdivia:38000,Osorno:38000,'Puerto Montt':38000,'Puerto Varas':38000,Pucon:38000};const HUF={Temuco:3.92,Villarrica:3.92,Valdivia:4.39,Osorno:4.03,'Puerto Montt':3.70,'Puerto Varas':3.70,Pucon:3.92};const UF=40850.06,BC_EQUIPO=1899000,BC_FLETE=60000,BC_INST=380000;const $=x=>document.getElementById(x),clp=n=>'$'+Math.round(n).toLocaleString('es-CL');function calc(){const lado=+$('medida').value,prof=+$('prof').value||1.2,city=$('ciudad').value,tipo=$('tipo').value,ext=lado+.40,losa=ext*ext*.20,muros=(ext*ext-lado*lado)*prof,asiento=(lado*lado-Math.max(0,lado-1)**2)*.50,m3=losa+muros+asiento,mo=lado===2.5?2000000:2700000;let mat,sacos=0;if(tipo==='camion'){mat=m3*(HUF[city]||3.92)*UF}else{sacos=Math.ceil(m3*15);mat=m3*(ARIDO[city]||38000)+sacos*(CEMENTO[city]||5420)}const margen=(+$('margen').value||0)/100,base=(mat+mo)*(1+margen),bc=$('bc').value==='1'?(BC_EQUIPO+BC_FLETE+BC_INST):0,neto=base+bc,iva=neto*.19,total=neto+iva;$('titulo').textContent='Jacuzzi '+String(lado).replace('.',',')+' × '+String(lado).replace('.',',')+' m';$('detalle').innerHTML='<table><tr><td>Losa 20 cm</td><td>'+m3f(losa)+' m³</td></tr><tr><td>Muros 20 cm</td><td>'+m3f(muros)+' m³</td></tr><tr><td>Asiento perimetral 50×50 cm</td><td>'+m3f(asiento)+' m³</td></tr><tr><td>Hormigón estructural total</td><td>'+m3f(m3)+' m³</td></tr>'+(tipo==='mano'?'<tr><td>Cemento</td><td>'+sacos+' sacos</td></tr>':'')+'<tr><td>Materiales estructurales</td><td>'+clp(mat)+'</td></tr><tr><td>Mano de obra</td><td>'+clp(mo)+'</td></tr></table>';$('base').textContent=clp(base);$('lineaBC').textContent=bc?'Bomba de calor 70 m³ + flete + instalación: '+clp(bc):'Bomba de calor 70 m³: no incluida';$('neto').textContent=clp(neto);$('iva').textContent=clp(iva);$('total').textContent=clp(total)}function m3f(n){return n.toFixed(3).replace('.',',')}document.querySelectorAll('select,input').forEach(e=>e.addEventListener('input',calc));calc();</script></body></html>
